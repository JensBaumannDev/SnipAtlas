name: snipatlas

services:
  db:
    image: postgres:18
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: backend/.env
    volumes:
      - ./backend:/app
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
