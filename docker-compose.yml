name: snipatlas

services:
  db:
    image: postgres:18
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: backend/.env
    volumes:
      - ./backend:/app
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    profiles: ['ssr']
    environment:
      API_URL: http://backend:8000
      SITE_URL: http://localhost:4000
      NG_ALLOWED_HOSTS: localhost
    depends_on:
      - backend

  nginx:
    image: nginx:1.29-alpine
    profiles: ['ssr']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
