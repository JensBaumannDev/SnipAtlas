name: snipatlas

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    logging: *logging
    image: postgres:18
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    logging: *logging
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    command: >-
      sh -c 'python manage.py migrate --noinput
      && python manage.py createcachetable
      && python manage.py collectstatic --noinput
      && exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3'
    ports:
      - '127.0.0.1:8020:8000'
    volumes:
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    logging: *logging
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      SITE_URL: https://snipatlas.jensbaumann.com
      NG_ALLOWED_HOSTS: snipatlas.jensbaumann.com
    ports:
      - '127.0.0.1:4020:4000'
    depends_on:
      - backend

volumes:
  pgdata:
