map $request_method $snipatlas_admin_login_key {
    POST    $binary_remote_addr;
    default '';
}

limit_req_zone $snipatlas_admin_login_key zone=snipatlas_admin_login:10m rate=5r/m;

server {
    listen 80;
    server_name snipatlas.jensbaumann.com;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    limit_req_status 429;

    location /static/ {
        include /home/deploy/projects/snipatlas/nginx/server/security-headers.conf;
        alias /home/deploy/projects/snipatlas/staticfiles/;
        expires 30d;
    }

    location = /__ADMIN_PATH__/login/ {
        limit_req zone=snipatlas_admin_login burst=3 nodelay;
        include /home/deploy/projects/snipatlas/nginx/server/security-headers.conf;
        include /home/deploy/projects/snipatlas/nginx/server/proxy.conf;
        proxy_pass http://127.0.0.1:8020;
    }

    location /__ADMIN_PATH__/ {
        include /home/deploy/projects/snipatlas/nginx/server/security-headers.conf;
        include /home/deploy/projects/snipatlas/nginx/server/proxy.conf;
        proxy_pass http://127.0.0.1:8020;
    }

    location = /sitemap.xml {
        include /home/deploy/projects/snipatlas/nginx/server/security-headers.conf;
        include /home/deploy/projects/snipatlas/nginx/server/proxy.conf;
        proxy_pass http://127.0.0.1:8020;
    }

    location /api/ {
        include /home/deploy/projects/snipatlas/nginx/server/security-headers.conf;
        include /home/deploy/projects/snipatlas/nginx/server/proxy.conf;
        proxy_pass http://127.0.0.1:8020;
    }

    location / {
        include /home/deploy/projects/snipatlas/nginx/server/security-headers.conf;
        include /home/deploy/projects/snipatlas/nginx/server/proxy.conf;
        proxy_pass http://127.0.0.1:4020;
    }
}
