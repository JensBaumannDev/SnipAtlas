<h2 class="auth-form__title" id="auth-title">{{ 'auth.forgotTitle' | translate }}</h2>
<p class="auth-form__lead">{{ 'auth.forgotLead' | translate }}</p>

<form class="auth-form__fields" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label class="field__label" for="forgot-email">{{ 'auth.email' | translate }}</label>
    <input
      class="input"
      id="forgot-email"
      type="email"
      autocomplete="email"
      formControlName="email"
      [attr.aria-invalid]="emailError()"
      [attr.aria-describedby]="emailError() ? 'forgot-email-error' : null"
    />
    @if (emailError()) {
      <p class="field__error" id="forgot-email-error">
        {{ 'auth.errors.emailFormat' | translate }}
      </p>
    }
  </div>

  @if (submitted()) {
    <p class="auth-form__note" role="status">{{ 'auth.notYet' | translate }}</p>
  }

  <button class="btn btn--primary auth-form__submit" type="submit" [disabled]="!filled()">
    {{ 'auth.forgotSubmit' | translate }}
  </button>
</form>

<p class="auth-form__footer">
  <button class="auth-form__link auth-form__back" type="button" (click)="login.emit()">
    <svg [lucideIcon]="arrowLeftIcon" class="icon auth-form__back-icon"></svg>
    {{ 'auth.backToLogin' | translate }}
  </button>
</p>
