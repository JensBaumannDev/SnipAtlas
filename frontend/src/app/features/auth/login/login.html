<h2 class="auth-form__title" id="auth-title">{{ 'auth.login' | translate }}</h2>
<p class="auth-form__lead">{{ 'auth.lead' | translate }}</p>

<form class="auth-form__fields" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label class="field__label" for="login-email">{{ 'auth.email' | translate }}</label>
    <input
      class="input"
      id="login-email"
      type="email"
      autocomplete="email"
      formControlName="email"
      [attr.aria-invalid]="emailError()"
      [attr.aria-describedby]="emailError() ? 'login-email-error' : null"
    />
    @if (emailError()) {
      <p class="field__error" id="login-email-error">{{ 'auth.errors.emailFormat' | translate }}</p>
    }
  </div>

  <div class="field">
    <div class="auth-form__label-row">
      <label class="field__label" for="login-password">{{ 'auth.password' | translate }}</label>
      <button class="auth-form__link" type="button" (click)="forgot.emit()">
        {{ 'auth.forgot' | translate }}
      </button>
    </div>
    <app-password-field>
      <input
        class="input input--action"
        id="login-password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
      />
    </app-password-field>
  </div>

  <button class="btn btn--primary auth-form__submit" type="submit" [disabled]="!filled()">
    {{ 'auth.login' | translate }}
  </button>
</form>

<p class="auth-form__footer">
  {{ 'auth.noAccount' | translate }}
  <button class="auth-form__link" type="button" (click)="register.emit()">
    {{ 'auth.register' | translate }}
  </button>
</p>
