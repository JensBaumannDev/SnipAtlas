@if (blueprint(); as blueprint) {
  <app-topic-header
    [topic]="currentTopic()"
    [heading]="blueprint.title"
    [parentLabel]="currentTopic()?.name ?? ('pages.blueprints' | translate)"
    [parentLink]="[paths.path('blueprints', blueprint.topic), blueprint.topic]"
  >
    <p class="guide-detail__lead">{{ blueprint.summary }}</p>
  </app-topic-header>

  <div class="guide-detail__body">
    @if (projectKeys().length) {
      <section class="guide-detail__project" aria-labelledby="guide-project">
        <h2 class="guide-detail__project-title" id="guide-project">
          {{ 'project.title' | translate }}
        </h2>
        <p class="guide-detail__project-hint">{{ 'project.hint' | translate }}</p>
        <app-project-form [keys]="projectKeys()" />
      </section>
    }

    <div class="guide-detail__progress">
      <div class="guide-detail__progress-inner">
        <app-progress-bar
          class="guide-detail__bar"
          [done]="doneCount()"
          [total]="blueprint.steps.length"
          [label]="'guides.progressLabel' | translate"
        />
        @if (doneCount()) {
          <button class="btn btn--ghost" type="button" (click)="reset()">
            {{ 'guides.reset' | translate }}
          </button>
        }
      </div>
  </div>

  <ol class="guide-detail__steps" role="list">
    @for (step of blueprint.steps; track step.slug) {
      <li>
        <app-guide-step
          [step]="step"
          [number]="$index + 1"
          [done]="isDone(step.slug)"
          (toggled)="toggle(step.slug)"
        />
      </li>
    }
  </ol>
  </div>
}
