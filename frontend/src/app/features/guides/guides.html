@if (currentTopic(); as topic) {
  <app-topic-header
    [topic]="topic"
    [heading]="topic.name"
    [parentLabel]="'pages.blueprints' | translate"
    parentLink="/anleitungen"
  />

  <ul class="guides__list" role="list">
    @for (blueprint of topicBlueprints(); track blueprint.slug) {
      <li class="guides__item" [id]="blueprint.slug">
        <h2 class="guides__title">
          <a
            class="guides__link"
            [routerLink]="['/anleitungen', blueprint.topic, blueprint.slug]"
            >{{ blueprint.title }}</a
          >
        </h2>
        <p class="guides__summary">{{ blueprint.summary }}</p>
        <app-progress-bar
          [done]="progress.doneCount(blueprint)"
          [total]="blueprint.steps.length"
          [label]="'guides.progressOf' | translate: { title: blueprint.title }"
        />
      </li>
    } @empty {
      <li class="guides__empty">{{ 'guides.empty' | translate }}</li>
    }
  </ul>
} @else {
  <app-area-intro
    title="pages.blueprints"
    lead="guides.lead"
    [summary]="'guides.summary' | translate: summary()"
    [icon]="icon"
  >
    <app-area-info area="guides" [sections]="infoSections" />
  </app-area-intro>
}
