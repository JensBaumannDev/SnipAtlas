<header class="home__hero stage" data-theme="dark">
  <h1>{{ 'home.title' | translate }}</h1>
  <p class="home__lead">{{ 'home.lead' | translate }}</p>
  <app-search-box
    class="home__search"
    inputId="home-search"
    variant="hero"
    placeholder="search.heroPlaceholder"
    [shortcut]="true"
  />
</header>

<section aria-labelledby="home-areas">
  <div class="home__intro">
    <h2 class="home__heading" id="home-areas">{{ 'home.areasTitle' | translate }}</h2>
    <p class="home__text">{{ 'home.intro' | translate }}</p>
  </div>
  <app-area-cards />
  @if (news().length) {
    <div class="home__news">
      <div class="home__news-head">
        <h3 class="home__news-title">{{ 'home.news.title' | translate }}</h3>
        <a class="home__news-all" routerLink="/neu">{{ 'home.news.all' | translate }} →</a>
      </div>
      <app-news-list [items]="news()" />
    </div>
  }
  <app-guide-link class="home__guide" />
</section>
