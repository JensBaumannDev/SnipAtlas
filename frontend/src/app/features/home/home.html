<header class="home__hero">
  <h1 class="home__title">{{ 'home.title' | translate }}</h1>
  <p class="home__lead">{{ 'home.lead' | translate }}</p>
  <app-search-box
    class="home__search"
    inputId="home-search"
    variant="hero"
    placeholder="search.heroPlaceholder"
    [shortcut]="true"
  />
</header>

<section class="home__section" aria-labelledby="home-offer">
  <h2 class="home__heading" id="home-offer">{{ 'home.offer.title' | translate }}</h2>
  <app-offer />
</section>

<section class="home__section home__news" aria-labelledby="home-news">
  <h2 class="home__heading" id="home-news">{{ 'home.news.title' | translate }}</h2>
  <app-news-log class="home__log" [items]="news()" />
  <a class="home__link" routerLink="/neu">{{ 'home.news.all' | translate }} →</a>
</section>
