@if (state(); as state) {
  <a
    class="guide-link__link"
    [routerLink]="paths.link('blueprints', state.blueprint.topic, state.blueprint.slug)"
  >
    {{ 'home.guide.continue' | translate: { title: state.blueprint.title } }}
    →
  </a>
  <span class="guide-link__progress">
    {{ 'home.guide.progress' | translate: { done: state.done, total: state.blueprint.steps.length } }}
  </span>
}
