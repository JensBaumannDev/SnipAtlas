<app-disclosure [anchor]="guide().slug" [(expanded)]="expanded">
  <span disclosure-title>{{ guide().title }}</span>
  <span disclosure-summary>{{ guide().summary }}</span>

  <app-debug-guide-steps [guide]="guide()" />
  <app-report-link [subject]="('report.guide' | translate) + ': ' + guide().title" />
</app-disclosure>
