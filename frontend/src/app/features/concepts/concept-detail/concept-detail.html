@if (concept(); as concept) {
  @if (currentTopic(); as topic) {
    @let subtopic = currentSubtopic();

    <app-topic-header
      class="concept-detail__header"
      [topic]="topic"
      [heading]="concept.title"
      [parentLabel]="subtopic ? topic.name + ' · ' + subtopic.name : topic.name"
      [parentLink]="['/grundlagen', topic.slug, concept.subtopic]"
    >
      <p class="concept-detail__summary">{{ concept.summary }}</p>
    </app-topic-header>

    <div class="concept-detail__body">
      <app-term-text class="concept-detail__explanation" [text]="concept.explanation" />
      <app-code-block [code]="concept.code" [language]="concept.language" />
      @if (concept.note; as note) {
        <app-note [label]="'concepts.note' | translate" [text]="note" />
      }
      <app-report-link [subject]="('report.concept' | translate) + ': ' + concept.title" />
    </div>

    @if (related().length) {
      <app-related-list [name]="subtopic?.name ?? topic.name" [items]="related()" />
    }
  }
}
