<app-disclosure [anchor]="concept().slug" [level]="level()" [(expanded)]="expanded">
  <span disclosure-title>{{ concept().title }}</span>
  <span disclosure-summary>{{ concept().summary }}</span>

  <app-term-text class="concept-card__explanation" [text]="concept().explanation" />
  <app-code-block [code]="concept().code" [language]="concept().language" />
  @if (concept().note; as note) {
    <app-note [label]="'concepts.note' | translate" [text]="note" />
  }
  <app-item-links
    [link]="link()"
    [title]="concept().title"
    [report]="('report.concept' | translate) + ': ' + concept().title"
  />
</app-disclosure>
