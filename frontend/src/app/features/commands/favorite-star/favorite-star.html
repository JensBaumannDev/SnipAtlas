<button
  #star
  class="favorite-star"
  type="button"
  [class.favorite-star--active]="favorite()"
  [class.favorite-star--labeled]="labeled()"
  [attr.aria-pressed]="favorite()"
  [attr.aria-label]="labeled() ? null : ('favorites.toggle' | translate: { title: entry().title })"
  (click)="toggle()"
>
  <svg [lucideIcon]="starIcon" class="icon favorite-star__icon"></svg>
  @if (labeled()) {
    {{ 'favorites.label' | translate }}
  }
</button>

@if (loginHint()) {
  <p class="favorite-star__hint" role="status">
    {{ 'favorites.loginHint' | translate }}
    <button class="favorite-star__login" type="button" (click)="login()">
      {{ 'auth.login' | translate }}
    </button>
  </p>
}
