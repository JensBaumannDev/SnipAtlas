<app-disclosure [anchor]="entry().slug" [level]="level()" [(expanded)]="expanded">
  <span disclosure-title>{{ entry().title }}</span>
  @if (!expanded()) {
    <code disclosure-summary>{{ peek() }}</code>
  }
  <app-favorite-star disclosure-action [entry]="entry()" />

  <app-term-text class="entry-card__description" [text]="entry().description" />
  <app-code-block [code]="resolved().code" [language]="entry().language" [os]="resolved().os" />
  <app-item-links
    [link]="link()"
    [title]="entry().title"
    [report]="('report.command' | translate) + ': ' + entry().title"
  />
</app-disclosure>
