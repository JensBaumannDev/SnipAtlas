@let current = open();
<p class="term-text__text">@for (part of parts(); track $index) {@if (part.term; as term) {<button class="term-text__term" type="button" [class.term-text__term--open]="current?.slug === term.slug" [attr.aria-expanded]="current?.slug === term.slug" [attr.aria-controls]="definitionId" (click)="toggle(term)">{{ part.text }}</button>} @else {{{ part.text }}}}</p>

@if (current) {
  <div class="term-text__definition" [id]="definitionId">
    <p class="term-text__name">{{ current.term }}</p>
    <p class="term-text__meaning">{{ current.definition }}</p>
    <a class="term-text__more" routerLink="/begriffe" [fragment]="current.slug">
      {{ 'glossary.all' | translate }} →
    </a>
  </div>
}
