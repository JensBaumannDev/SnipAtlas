@let current = open();
<div class="term-text__body">
  @for (paragraph of paragraphs(); track $index) {
    <p>
      @for (part of paragraph; track $index) {
        @if (part.term; as term) {
          <button
            class="term-text__term"
            type="button"
            [class.term-text__term--open]="current?.slug === term.slug"
            [attr.aria-expanded]="current?.slug === term.slug"
            [attr.aria-controls]="definitionId"
            (click)="toggle(term)"
          >
            {{ part.text }}
          </button>
        } @else {
          {{ part.text }}
        }
      }
    </p>
  }
</div>

@if (current) {
  <div class="term-text__definition" [id]="definitionId">
    <p class="term-text__name">{{ current.term }}</p>
    <p class="term-text__meaning">{{ current.definition }}</p>
    <a class="term-text__more" routerLink="/begriffe" [fragment]="current.slug">
      {{ 'glossary.all' | translate }} →
    </a>
  </div>
}
