<div class="terminal__bar">
  <span class="terminal__dots" aria-hidden="true">
    <span class="terminal__dot terminal__dot--close"></span>
    <span class="terminal__dot terminal__dot--minimize"></span>
    <span class="terminal__dot terminal__dot--zoom"></span>
  </span>
  <span class="terminal__title">{{ title() }}</span>
</div>

<div class="terminal__body">
  <p class="terminal__line">
    <span aria-hidden="true">
      <span class="terminal__user">{{ user }}</span>
      <span>:</span>
      <span class="terminal__cwd">{{ cwd() }}</span>
      <span>$ </span>
    </span>
    @for (token of tokens(); track $index) {
      <span [class]="'terminal__token terminal__token--' + token.kind">{{ token.text }}</span>
    }
  </p>
  <ng-content />
  @if (cursor()) {
    <p class="terminal__line" aria-hidden="true">
      <span class="terminal__user">{{ user }}</span>
      <span>:</span>
      <span class="terminal__cwd">{{ cwd() }}</span>
      <span>$ </span>
      <span class="terminal__cursor"></span>
    </p>
  }
</div>
