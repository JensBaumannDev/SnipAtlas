<header class="topic-header">
  @if (topic(); as topic) {
    <app-topic-logo class="topic-header__logo" [topic]="topic" />
  }
  <div class="topic-header__heading">
    @if (parentLabel(); as label) {
      <a class="topic-header__parent" [routerLink]="parentLink()">{{ label }}</a>
    }
    <h1>{{ heading() }}</h1>
    <ng-content />
  </div>
  <ng-content select="button, app-favorite-star" />
</header>
