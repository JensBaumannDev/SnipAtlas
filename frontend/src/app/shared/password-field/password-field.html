<ng-content />

<button
  class="password-field__toggle"
  type="button"
  [attr.aria-label]="'auth.showPassword' | translate"
  [attr.aria-pressed]="visible()"
  (click)="toggle()"
>
  @if (visible()) {
    <svg [lucideIcon]="eyeOffIcon" class="icon password-field__icon"></svg>
  } @else {
    <svg [lucideIcon]="eyeIcon" class="icon password-field__icon"></svg>
  }
</button>
