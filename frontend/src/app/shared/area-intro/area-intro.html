<header class="area-intro__header">
  <div class="area-intro__frame">
    <svg [lucideIcon]="icon()" class="icon area-intro__icon"></svg>
  </div>
  <h1 class="area-intro__title">{{ title() | translate }}</h1>
  <p class="area-intro__lead">{{ lead() | translate }}</p>
  @if (summary(); as summary) {
    <p class="area-intro__meta">{{ summary }}</p>
  }
</header>

<ng-content />
