@for (group of visibleGroups(); track group.slug) {
  <section class="topic-index__group" [attr.aria-labelledby]="'topic-index-' + group.slug">
    <h2 class="topic-index__title" [id]="'topic-index-' + group.slug">{{ group.name }}</h2>
    <ul class="topic-index__list" role="list">
      @for (topic of group.topics; track topic.slug) {
        <li class="topic-index__item">
          <a class="topic-index__link" [routerLink]="[path(), topic.slug]">
            <app-topic-logo class="topic-index__logo" [topic]="topic" />
            <span class="topic-index__text">
              <span class="topic-index__name">{{ topic.name }}</span>
              <span class="topic-index__subtopics">{{ subtopicNames(topic.subtopics) }}</span>
            </span>
            <svg [lucideIcon]="chevronRightIcon" class="icon topic-index__chevron"></svg>
          </a>
        </li>
      }
    </ul>
  </section>
}
