<header class="topbar">
  <a class="brand" routerLink="/" aria-label="SnipAtlas, zur Startseite">
    <span class="brand__mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <ellipse cx="12" cy="12" rx="4" ry="9" />
        <path d="M3.5 9h17M3.5 15h17" />
      </svg>
    </span>
    <span class="brand__name">Snip<span class="brand__accent">Atlas</span></span>
  </a>

  <div class="search" role="search">
    <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <label class="visually-hidden" for="search">Befehle, Fehlermeldungen und Begriffe durchsuchen</label>
    <input
      #searchInput
      id="search"
      class="input search__input"
      type="search"
      placeholder="Suchen …"
      autocomplete="off"
    />
    <kbd class="search__shortcut" aria-hidden="true"><span>Strg</span><span>K</span></kbd>
  </div>

  <div class="topbar__tools">
    <app-settings-menu />

    <button type="button" class="btn btn--primary">Anmelden</button>
  </div>
</header>
