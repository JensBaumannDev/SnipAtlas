<header class="topbar">
  <a class="brand" routerLink="/" [attr.aria-label]="'app.home' | translate">
    <span class="logo brand__logo" aria-hidden="true"></span>
    <span class="brand__name">Snip<span class="brand__accent">Atlas</span></span>
  </a>

  <div class="search" role="search">
    <svg lucideSearch class="icon search__icon"></svg>
    <label class="visually-hidden" for="search">{{ 'search.label' | translate }}</label>
    <input
      #searchInput
      id="search"
      class="input search__input"
      type="search"
      [placeholder]="'search.placeholder' | translate"
      autocomplete="off"
    />
    <kbd class="search__shortcut" aria-hidden="true"
      ><span>{{ 'search.ctrl' | translate }}</span
      ><span>K</span></kbd
    >
  </div>

  <div class="topbar__tools">
    <a
      class="btn btn--icon topbar__settings"
      routerLink="/einstellungen"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [attr.aria-label]="'settings.title' | translate"
    >
      <svg lucideSettings class="icon topbar__icon"></svg>
    </a>

    @if (session.user()) {
      <app-user-menu (loggedOut)="onLogout()" />
    } @else {
      <button #loginButton type="button" class="btn btn--primary" (click)="openLogin()">
        {{ 'auth.login' | translate }}
      </button>
    }
  </div>
</header>
