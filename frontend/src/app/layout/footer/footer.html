<footer class="footer">
  <p class="footer__copyright">
    <span class="logo footer__logo" aria-hidden="true"></span>
    © {{ year }} SnipAtlas
  </p>
  <nav [attr.aria-label]="'footer.label' | translate">
    <ul class="footer__links" role="list">
      <li>
        <a class="footer__link" routerLink="/impressum">{{ 'pages.imprint' | translate }}</a>
      </li>
      <li>
        <a class="footer__link" routerLink="/datenschutz">{{ 'pages.privacy' | translate }}</a>
      </li>
      <li>
        <a class="footer__link" routerLink="/faq">{{ 'pages.faq' | translate }}</a>
      </li>
      <li>
        <a class="footer__link" routerLink="/anfrage">{{ 'pages.request' | translate }}</a>
      </li>
      <li>
        <a class="footer__link" routerLink="/vscode-theme">
          {{ 'footer.vscodeTheme' | translate }}
        </a>
      </li>
    </ul>
  </nav>
</footer>
