<button
  #trigger
  class="user-menu__avatar"
  type="button"
  aria-controls="user-menu"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'account.menu' | translate"
  (click)="toggle()"
>
  <svg [lucideIcon]="userIcon" class="icon user-menu__avatar-icon" aria-hidden="true"></svg>
</button>

<div class="user-menu__panel" id="user-menu" [hidden]="!open()">
  <p class="user-menu__who">
    <span class="user-menu__email">{{ session.user()?.email }}</span>
    <span class="user-menu__state">{{ 'account.signedIn' | translate }}</span>
  </p>

  <ul class="user-menu__list" role="list">
    <li>
      <a class="user-menu__item" routerLink="/profil" (click)="close()">
        <svg [lucideIcon]="userIcon" class="icon user-menu__icon"></svg>
        {{ 'account.profile' | translate }}
      </a>
    </li>
    <li>
      <a class="user-menu__item" routerLink="/profil/anfragen" (click)="close()">
        <svg [lucideIcon]="messageSquareIcon" class="icon user-menu__icon"></svg>
        {{ 'account.requests' | translate }}
      </a>
    </li>
    <li>
      <a class="user-menu__item" routerLink="/profil/einstellungen" (click)="close()">
        <svg [lucideIcon]="settingsIcon" class="icon user-menu__icon"></svg>
        {{ 'settings.title' | translate }}
      </a>
    </li>
    <li class="user-menu__separator">
      <button class="user-menu__item" type="button" (click)="logout()">
        <svg [lucideIcon]="logOutIcon" class="icon user-menu__icon"></svg>
        {{ 'account.logout' | translate }}
      </button>
    </li>
  </ul>
</div>
