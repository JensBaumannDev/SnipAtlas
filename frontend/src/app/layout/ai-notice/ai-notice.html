<section class="ai-notice" aria-labelledby="ai-notice-title">
  <h2 class="ai-notice__title" id="ai-notice-title">{{ 'ai.notice.title' | translate }}</h2>
  <p class="ai-notice__text">{{ 'ai.notice.text' | translate }}</p>
  <button class="btn ai-notice__confirm" type="button" (click)="confirmed.emit()">
    {{ 'ai.notice.confirm' | translate }}
  </button>
</section>
