<button
  #triggerButton
  type="button"
  class="btn btn--icon"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  [attr.aria-label]="'settings.title' | translate"
  aria-controls="settings-panel"
  [attr.aria-expanded]="isOpen()"
  (click)="toggle()"
>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.6-1 3.4.8 2.4 2.4a1.7 1.7 0 0 0 1.1 2.6c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1.1 2.6c1 1.6-.8 3.4-2.4 2.4a1.7 1.7 0 0 0-2.6 1.1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.6-1.1c-1.6 1-3.4-.8-2.4-2.4a1.7 1.7 0 0 0-1.1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1.1-2.6c-1-1.6.8-3.4 2.4-2.4a1.7 1.7 0 0 0 2.6-1.1z" />
    <circle cx="12" cy="12" r="3" />
  </svg>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="16"
  (attach)="focusSelected()"
  (detach)="close()"
  (overlayOutsideClick)="onOutsideClick($event)"
  (overlayKeydown)="onKeydown($event)"
>
  <div
    #panel
    id="settings-panel"
    class="settings"
    role="dialog"
    [attr.aria-label]="'settings.title' | translate"
    (focusout)="onFocusOut($event)"
  >
    <fieldset class="settings__group">
      <legend class="settings__legend">{{ 'settings.theme' | translate }}</legend>
      <div class="segmented">
        @for (option of themeOptions; track option.value) {
          <label class="segmented__option">
            <input
              class="visually-hidden"
              type="radio"
              name="theme"
              [value]="option.value"
              [checked]="preferences.theme() === option.value"
              (change)="preferences.setTheme(option.value)"
            />
            <span>{{ option.label | translate }}</span>
          </label>
        }
      </div>
    </fieldset>

    <fieldset class="settings__group">
      <legend class="settings__legend">{{ 'settings.os' | translate }}</legend>
      <div class="segmented">
        @for (option of osOptions; track option.value) {
          <label class="segmented__option">
            <input
              class="visually-hidden"
              type="radio"
              name="os"
              [value]="option.value"
              [checked]="preferences.os() === option.value"
              (change)="preferences.setOs(option.value)"
            />
            <span>{{ option.label | translate }}</span>
          </label>
        }
      </div>
    </fieldset>

    <fieldset class="settings__group">
      <legend class="settings__legend">{{ 'settings.language' | translate }}</legend>
      <div class="segmented">
        @for (option of languageOptions; track option.value) {
          <label class="segmented__option">
            <input
              class="visually-hidden"
              type="radio"
              name="language"
              [value]="option.value"
              [checked]="preferences.language() === option.value"
              (change)="preferences.setLanguage(option.value)"
            />
            <span [attr.lang]="option.value">{{ option.label | translate }}</span>
          </label>
        }
      </div>
    </fieldset>
  </div>
</ng-template>
